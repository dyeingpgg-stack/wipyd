<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050814">
<script>
/* Tema: default mode malam. Pilihan pengguna (tombol tema) tersimpan di perangkat dan dipakai bersama halaman 1. */
(function () {
  var t = '';
  try { t = localStorage.getItem('wipyd_theme') || ''; } catch (e) { /* abaikan */ }
  if (t !== 'light' && t !== 'dark') t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#eef2fb' : '#050814');
})();
</script>
<script>
/* Mode (Admin / Viewer) sama dengan halaman 1: ?mode=viewer = Viewer; selain itu Admin. Halaman ini hanya baca. */
(function () {
  var q = '';
  try { q = String(window.WIPYD_FORCE_MODE || new URLSearchParams(location.search).get('mode') || '').toLowerCase(); } catch (e) { /* abaikan */ }
  var h = document.documentElement;
  h.setAttribute('data-mode', q === 'viewer' ? 'viewer' : 'admin');
  if (q === 'viewer') h.setAttribute('data-lock', '1');
})();
</script>
<meta name="description" content="WIP Yarn Dyeing halaman 2: Pack dan RPH">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WIP YD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>WIP Yarn Dyeing - Halaman 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --scheme:dark;--void:#050814;--text:#eaf0ff;--dim:#93a0cc;--cyan:#22f3ff;--cyan-2:#7cf9ff;--magenta:#ff3df0;--violet:#8b5cff;--lime:#5dffa0;--lime-2:#9dffc8;--amber:#ffc24d;--rose:#ff4d85;--rose-2:#ff7aa5;--c-rgb:34,243,255;--g-rgb:93,255,160;--a-rgb:255,194,77;--r-rgb:255,77,133;--m-rgb:255,61,240;--e-rgb:130,160,255;--w-rgb:255,255,255;--surface:#0a1030;--surface-2:#0d1438;--surface-3:#0c1334;--surface-hover:#122052;--bar:rgba(8,12,30,.94);--bar-solid:rgba(8,12,30,.97);--app-bg:rgba(5,8,20,.55);--soft:#c4cdf2;--placeholder:#6f7aa5;--empty:#47517c;--alert-ink:#ffd3df;--bad-ink:#ffb3c8;--dup-bg:#2b2410;--dup-bg-h:#3a3014;--dup2-bg:#3a1226;--dup2-bg-h:#4a1830;--ink-c:#02131a;--ink-g:#03170d;--badge-ink:#1a1200;
    --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --scheme:light;--void:#eef2fb;--text:#0f1a3d;--dim:#56628b;--cyan:#086f93;--cyan-2:#0b88b0;--magenta:#a01f91;--violet:#6a3de8;--lime:#0c7d44;--lime-2:#129a58;--amber:#965708;--rose:#c0275c;--rose-2:#dc4478;--c-rgb:8,111,147;--g-rgb:12,125,68;--a-rgb:150,87,8;--r-rgb:192,39,92;--m-rgb:160,31,145;--e-rgb:70,90,160;--w-rgb:15,26,61;--surface:#ffffff;--surface-2:#f3f6fd;--surface-3:#e4eafa;--surface-hover:#d9e4fa;--bar:rgba(255,255,255,.95);--bar-solid:rgba(255,255,255,.98);--app-bg:rgba(255,255,255,.55);--soft:#2b3866;--placeholder:#8791b5;--empty:#aab3d1;--alert-ink:#8a1740;--bad-ink:#ffb3c8;--dup-bg:#fff3d6;--dup-bg-h:#ffe7b0;--dup2-bg:#ffdfe9;--dup2-bg-h:#ffc8d9;--ink-c:#ffffff;--ink-g:#ffffff;--badge-ink:#ffffff;
  }
  /* Pemindai kamera selalu gelap, apa pun tema aplikasi */
  :root[data-theme="light"] .scanner{
    --scheme:dark;--void:#050814;--text:#eaf0ff;--dim:#93a0cc;--cyan:#22f3ff;--cyan-2:#7cf9ff;--magenta:#ff3df0;--violet:#8b5cff;--lime:#5dffa0;--lime-2:#9dffc8;--amber:#ffc24d;--rose:#ff4d85;--rose-2:#ff7aa5;--c-rgb:34,243,255;--g-rgb:93,255,160;--a-rgb:255,194,77;--r-rgb:255,77,133;--m-rgb:255,61,240;--e-rgb:130,160,255;--w-rgb:255,255,255;--surface:#0a1030;--surface-2:#0d1438;--surface-3:#0c1334;--surface-hover:#122052;--bar:rgba(8,12,30,.94);--bar-solid:rgba(8,12,30,.97);--app-bg:rgba(5,8,20,.55);--soft:#c4cdf2;--placeholder:#6f7aa5;--empty:#47517c;--alert-ink:#ffd3df;--bad-ink:#ffb3c8;--dup-bg:#2b2410;--dup-bg-h:#3a3014;--dup2-bg:#3a1226;--dup2-bg-h:#4a1830;--ink-c:#02131a;--ink-g:#03170d;--badge-ink:#1a1200;
  }
  /* Mode terang: tanpa efek cahaya pada teks, dan peralihan halus saat ganti tema */
  :root[data-theme="light"] *{text-shadow:none!important}
  :root[data-theme="light"] .orb{filter:none}
  :root[data-theme="light"] .app{box-shadow:0 10px 40px rgba(40,60,120,.18)}
  :root[data-theme="light"] .btn:disabled{filter:grayscale(.5) brightness(1.05) opacity(.6)}
  :root[data-theme="light"] .sheet-backdrop{background:rgba(15,26,61,.5)}
  html{color-scheme:var(--scheme)}
  .theme-moon{display:none}
  :root[data-theme="light"] .theme-sun{display:none}
  :root[data-theme="light"] .theme-moon{display:block}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--void);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
  body{display:flex;justify-content:center;align-items:stretch;overflow:hidden}
  button{font-family:inherit}

  /* ---------- Latar ---------- */
  .bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 15% 0%,rgba(var(--c-rgb),.16),transparent 70%),
      radial-gradient(55% 40% at 100% 100%,rgba(var(--m-rgb),.14),transparent 70%),
      var(--void)}
  .bg::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
    background-image:linear-gradient(rgba(var(--e-rgb),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--e-rgb),.06) 1px,transparent 1px);
    background-size:32px 32px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 100%);
    mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 100%)}

  /* ---------- Bingkai aplikasi (portrait 9:16) ---------- */
  .app{position:relative;z-index:1;width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--app-bg)}
  @media(min-width:600px){
    body{align-items:center}
    .app{height:764px;height:min(calc(100vh - 32px),764px);height:min(calc(100dvh - 32px),764px);border-radius:30px;border:1px solid var(--edge-strong);
      box-shadow:0 0 0 1px rgba(var(--c-rgb),.08),0 0 48px rgba(var(--c-rgb),.14),0 0 110px rgba(var(--m-rgb),.10)}
  }

  /* ---------- Topbar ---------- */
  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + var(--safe-top)) 16px 12px;border-bottom:1px solid var(--edge)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .orb{flex:none;width:38px;height:38px;filter:drop-shadow(0 0 5px rgba(var(--c-rgb),.85)) drop-shadow(0 0 12px rgba(var(--m-rgb),.45))}
  .orb-ring{stroke:var(--cyan)}
  .orb-ring2{stroke:var(--magenta)}
  .orb-dot{fill:var(--text)}
  .orb-inner{transform-origin:20px 20px;animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{margin:0;font:600 20px/1.1 var(--display);text-shadow:0 0 12px rgba(var(--c-rgb),.55)}
  .brand p{margin:3px 0 0;font-size:13px;color:var(--dim)}

  .icon-btn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:border-color .15s,box-shadow .15s,transform .1s}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn:hover,.icon-btn:focus-visible{border-color:var(--cyan);box-shadow:0 0 14px rgba(var(--c-rgb),.4);outline:none}
  .icon-btn.danger:hover,.icon-btn.danger:focus-visible{border-color:var(--rose);box-shadow:0 0 14px rgba(var(--r-rgb),.45)}
  .icon-btn.sm{width:36px;height:36px;border-radius:11px}
  .icon-btn.sm svg{width:18px;height:18px}
  .icon-btn.spin svg{animation:spin 1s linear infinite}
  .top-actions{display:flex;gap:8px;flex:none}
  .icon-btn.install{border-color:rgba(var(--g-rgb),.6);color:var(--lime);box-shadow:0 0 12px rgba(var(--g-rgb),.25)}
  .qpill{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--amber);background:rgba(var(--a-rgb),.12);color:var(--amber);font:600 13px var(--body);cursor:pointer;align-self:center}
  [hidden]{display:none!important}

  /* ---------- Area isi ---------- */
  main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;scrollbar-width:thin;scrollbar-color:rgba(var(--c-rgb),.35) transparent}
  main.is-data{overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px}
  .view{display:none}
  .view.active{display:block}
  #viewData.active,.view.list.active{display:flex;flex-direction:column;flex:1;min-height:0}
  .hint{margin:0 0 18px;font-size:13.5px;color:var(--dim)}
  .hint .req{color:var(--rose)}
  .hint-sm{margin:0 2px 10px;font-size:12.5px;color:var(--dim)}

  /* ---------- Field ---------- */
  .field{margin-bottom:22px;position:relative}
  .label{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;font-size:15px;font-weight:600;color:var(--soft)}
  .req{color:var(--rose);margin-left:4px;text-shadow:0 0 8px rgba(var(--r-rgb),.7)}
  .opt{font-weight:400;font-size:13px;color:var(--dim)}
  .input,.textarea{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04);color:var(--text);font:inherit;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
  .textarea{resize:none;min-height:84px}
  .input::placeholder,.textarea::placeholder{color:var(--placeholder)}
  .input:focus,.textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(var(--c-rgb),.35)}
  .input:disabled{opacity:.6}
  .textarea[readonly],.input[readonly]{background:rgba(var(--c-rgb),.05);border-color:rgba(var(--c-rgb),.28);color:var(--text);cursor:default}
  .textarea[readonly]:focus,.input[readonly]:focus{box-shadow:none;border-color:rgba(var(--c-rgb),.28)}
  .err{display:none;margin:8px 2px 0;font-size:14px;color:var(--rose)}
  .invalid .err{display:block}
  .invalid .input{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose),0 0 16px rgba(var(--r-rgb),.3)}
  .invalid .chip span{border-color:rgba(var(--r-rgb),.7)}

  /* ---------- KIKC combobox ---------- */
  .combo{position:relative}
  .combo .input{padding-right:62px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.3px}
  .combo.has-value .input{border-color:rgba(var(--g-rgb),.75);box-shadow:0 0 0 1px rgba(var(--g-rgb),.5),0 0 18px rgba(var(--g-rgb),.25);padding-right:104px}
  .combo-clear{position:absolute;right:54px;top:6px;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--dim);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .combo-clear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  .combo.has-value .combo-clear{display:inline-flex}
  .combo-scan{position:absolute;right:6px;top:6px;width:44px;height:40px;border:1px solid rgba(var(--c-rgb),.5);border-radius:12px;background:rgba(var(--c-rgb),.10);color:var(--cyan);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 0 12px rgba(var(--c-rgb),.25)}
  .combo-scan svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .combo-scan:disabled{opacity:.4;cursor:default;box-shadow:none}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:6px;list-style:none;max-height:240px;overflow-y:auto;border-radius:16px;border:1px solid var(--edge-strong);background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 24px rgba(var(--c-rgb),.15);display:none}
  .combo.open .combo-list{display:block}
  .combo-item{padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .combo-item b{font:600 17px var(--display);color:var(--text)}
  .combo-item small{font-size:13px;color:var(--dim)}
  .combo-item.active,.combo-item:hover{background:rgba(var(--c-rgb),.12)}
  .combo-item mark{background:none;color:var(--cyan);text-shadow:0 0 8px rgba(var(--c-rgb),.6)}
  .combo-add b{color:var(--lime)}
  .combo-add{border:1px dashed rgba(var(--g-rgb),.45);margin-top:4px}
  .combo-empty{padding:14px;color:var(--dim);font-size:15px}
  .combo-status{margin:8px 2px 0;font-size:13px;color:var(--dim)}

  .alert{margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(var(--r-rgb),.5);background:rgba(var(--r-rgb),.08);color:var(--alert-ink);font-size:14px;overflow-wrap:anywhere}
  .btn-sm{margin-top:10px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--edge-strong);background:rgba(var(--w-rgb),.06);color:var(--text);font:600 15px var(--body);cursor:pointer}

  /* ---------- Panel data KIKC ---------- */
  .hud{position:relative;margin-top:14px;padding:14px 14px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(var(--c-rgb),.07),rgba(var(--c-rgb),.02));border:1px solid rgba(var(--c-rgb),.28);display:grid;grid-template-columns:repeat(6,1fr);gap:12px 10px}
  .hud::before,.hud::after{content:"";position:absolute;width:15px;height:15px;border:2px solid var(--cyan);filter:drop-shadow(0 0 5px rgba(var(--c-rgb),.9))}
  .hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
  .hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
  .cell{grid-column:span 2;min-width:0}
  .cell.w3{grid-column:span 3}
  .cell small{display:block;font-size:12.5px;color:var(--dim);margin-bottom:2px}
  .cell span{display:block;font:600 19px/1.15 var(--display);color:var(--text);overflow-wrap:anywhere}
  .cell span.empty{color:var(--empty)}
  .hud.pulse .cell span{animation:readout .7s ease-out}
  @keyframes readout{0%{color:var(--cyan);text-shadow:0 0 14px rgba(var(--c-rgb),.95)}100%{color:var(--text);text-shadow:none}}

  /* ---------- Pilihan tombol ---------- */
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chips.c4{grid-template-columns:repeat(4,1fr)}
  .chip{position:relative;display:block;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
  .chip input{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .chip span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:6px;border-radius:14px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04);font-size:16px;font-weight:600;color:var(--soft);transition:border-color .15s,box-shadow .15s,background .15s,color .15s}
  .chip.sm span{font-size:15px}
  .chip input:checked + span{color:var(--cyan);border-color:var(--cyan);background:rgba(var(--c-rgb),.12);box-shadow:0 0 0 1px var(--cyan),0 0 16px rgba(var(--c-rgb),.45),inset 0 0 14px rgba(var(--c-rgb),.12);text-shadow:0 0 10px rgba(var(--c-rgb),.7)}
  .chip input:focus-visible + span{outline:2px solid #fff;outline-offset:2px}
  .chip.good input:checked + span{color:var(--lime);border-color:var(--lime);background:rgba(var(--g-rgb),.12);box-shadow:0 0 0 1px var(--lime),0 0 16px rgba(var(--g-rgb),.45),inset 0 0 14px rgba(var(--g-rgb),.1);text-shadow:0 0 10px rgba(var(--g-rgb),.7)}
  .chip.warn input:checked + span{color:var(--amber);border-color:var(--amber);background:rgba(var(--a-rgb),.12);box-shadow:0 0 0 1px var(--amber),0 0 16px rgba(var(--a-rgb),.45),inset 0 0 14px rgba(var(--a-rgb),.1);text-shadow:0 0 10px rgba(var(--a-rgb),.7)}
  .chip.bad input:checked + span{color:var(--rose);border-color:var(--rose);background:rgba(var(--r-rgb),.12);box-shadow:0 0 0 1px var(--rose),0 0 16px rgba(var(--r-rgb),.45),inset 0 0 14px rgba(var(--r-rgb),.1);text-shadow:0 0 10px rgba(var(--r-rgb),.7)}

  /* ---------- Tombol aksi ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;border:0;font:700 18px var(--display);cursor:pointer;transition:transform .1s,box-shadow .15s,filter .15s}
  .btn:active{transform:scale(.98)}
  .btn-primary{color:var(--ink-c);background:linear-gradient(135deg,var(--cyan),var(--cyan-2));box-shadow:0 0 0 1px rgba(var(--c-rgb),.9),0 0 22px rgba(var(--c-rgb),.55),0 0 54px rgba(var(--c-rgb),.25)}
  .btn-update{color:var(--ink-g);background:linear-gradient(135deg,var(--lime),var(--lime-2));box-shadow:0 0 0 1px rgba(var(--g-rgb),.9),0 0 22px rgba(var(--g-rgb),.5),0 0 54px rgba(var(--g-rgb),.22)}
  .btn-danger{color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-2));box-shadow:0 0 0 1px rgba(var(--r-rgb),.9),0 0 22px rgba(var(--r-rgb),.5)}
  .btn-ghost{background:rgba(var(--w-rgb),.05);color:var(--text);border:1px solid var(--edge-strong);font:600 17px var(--body)}
  .btn:disabled{filter:grayscale(.6) brightness(.65);box-shadow:none;cursor:wait}
  .actions{display:flex;gap:10px;margin-top:6px}
  .actions .btn-ghost{width:36%}
  .spinner{width:20px;height:20px;border-radius:50%;border:3px solid rgba(0,0,0,.25);border-top-color:var(--ink-c);animation:spin .8s linear infinite}

  /* ---------- Halaman data (tabel) ---------- */
  .search{position:relative;margin-bottom:10px;flex:none}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
  .search .input{padding-left:44px;min-height:46px}
  .filters{flex:none;display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04);color:var(--soft);font:600 15px var(--body);cursor:pointer}
  .fchip.active{color:var(--cyan);border-color:var(--cyan);background:rgba(var(--c-rgb),.12);box-shadow:0 0 14px rgba(var(--c-rgb),.4)}
  /* Tab Plan: baris Sisa Order diberi highlight; riwayat Plan hanya lihat */
  tbody tr.sisa td{background:rgba(var(--r-rgb),.13) !important}
  tbody tr.sisa td:first-child{box-shadow:inset 3px 0 0 var(--rose)}
  .tag-sisa{display:inline-block;padding:2px 10px;border-radius:999px;font:700 12px var(--body);color:var(--rose);background:rgba(var(--r-rgb),.14);border:1px solid rgba(var(--r-rgb),.55);white-space:nowrap}
  #viewPlan.plan-hist #rsPlan{display:none}
  #viewPlan.plan-hist #nPlan{color:var(--amber);font-weight:600}
  .pcreate{flex:none;display:flex;flex-direction:column;gap:10px;margin:0 0 10px;padding:12px;border:1px solid var(--edge-strong);border-radius:16px;background:var(--surface)}
  .pcreate[hidden]{display:none}
  .pc-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .pc-row .input{flex:1;min-width:150px;min-height:48px;padding:6px 10px;text-align:center;color-scheme:var(--scheme);font-family:var(--display);font-weight:600;font-size:17px}
  .pcreate .btn-sm{flex:1;margin:0;min-height:48px}
  .pcreate .btn-sm.primary{color:var(--ink-c);border-color:var(--cyan);background:linear-gradient(135deg,var(--cyan),var(--cyan-2))}
  .pcreate .btn-sm:disabled{opacity:.45;cursor:not-allowed}
  .pc-msg{font:600 14px var(--body);color:var(--soft)}
  .pc-warn{font:600 14px var(--body);color:var(--amber)}
  .pc-prev{max-height:32vh;overflow:auto;border:1px solid var(--edge);border-radius:12px}
  .pc-prev table{width:100%;border-collapse:collapse;font-size:13px}
  .pc-prev th,.pc-prev td{padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--edge)}
  .pc-prev th{position:sticky;top:0;background:var(--surface)}
  .daterow{flex:none;display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
  .daterow .input{flex:1;min-width:0;min-height:48px;padding:6px 10px;text-align:center;color-scheme:var(--scheme);font-family:var(--display);font-weight:600;font-size:17px}
  .daterow .icon-btn{width:48px;height:48px}
  .daterow .icon-btn:disabled{opacity:.35;cursor:default;box-shadow:none;border-color:var(--edge)}
  .btn-today{flex:none;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04);color:var(--soft);font:600 15px var(--body);cursor:pointer}
  .btn-today.active{color:var(--cyan);border-color:var(--cyan);background:rgba(var(--c-rgb),.12);box-shadow:0 0 14px rgba(var(--c-rgb),.4)}
  .stats{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .stat{min-width:0;padding:8px 10px 9px;border-radius:14px;border:1px solid rgba(var(--c-rgb),.28);background:linear-gradient(180deg,rgba(var(--c-rgb),.08),rgba(var(--c-rgb),.02))}
  .stats2{grid-template-columns:repeat(2,1fr)}
  .stat small{display:block;font-size:12.5px;color:var(--dim)}
  .stat b{display:block;font:700 24px/1.15 var(--display);color:var(--cyan);text-shadow:0 0 12px rgba(var(--c-rgb),.55);overflow-wrap:anywhere}
  .stat b.flash{animation:readout .7s ease-out}
  .stat .stat-sub{margin-top:1px;font-size:12px;font-weight:600;color:var(--amber)}
  .carry-note{flex:none;margin:0 0 10px;padding:8px 12px;border-radius:12px;border:1px solid rgba(var(--c-rgb),.35);background:rgba(var(--c-rgb),.08);font:600 13.5px/1.35 var(--body);color:var(--soft);max-width:480px}
  .carry-note b{color:var(--cyan)}
  .stats.s4{grid-template-columns:repeat(2,1fr)}
  @media(min-width:600px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
  .stat.g{border-color:rgba(var(--g-rgb),.4)}.stat.g b{color:var(--lime);text-shadow:0 0 12px rgba(var(--g-rgb),.5)}
  .stat.a{border-color:rgba(var(--a-rgb),.4)}.stat.a b{color:var(--amber);text-shadow:0 0 12px rgba(var(--a-rgb),.5)}
  .stat.r{border-color:rgba(var(--r-rgb),.45)}.stat.r b{color:var(--rose);text-shadow:0 0 12px rgba(var(--r-rgb),.5)}
  .dtools{flex:none;display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .dtools .btn-sm{display:inline-flex;align-items:center;gap:6px;margin:0;min-height:36px;padding:0 14px;font-size:14px}
  .dtools .btn-sm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .resume{flex:none;display:flex;flex-direction:column;max-height:40vh;overflow:hidden;margin:0 0 10px;padding:8px;border:1px solid var(--edge-strong);border-radius:16px;background:var(--surface)}
  .rs-scroll{flex:1 1 auto;min-height:72px;overflow:auto;-webkit-overflow-scrolling:touch}
  .rs-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  .rs-table th{padding:7px 10px;text-align:right;font:700 12.5px var(--display);color:var(--cyan);border-bottom:1px solid var(--edge-strong)}
  .rs-table th:first-child,.rs-table td:first-child{text-align:left}
  .rs-table td{padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums}
  .rs-table tbody tr:nth-child(even){background:rgba(var(--c-rgb),.06)}
  .rs-table td.tot,.rs-table th.tot{font-weight:700}
  .rs-cards{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
  .rs-card{min-width:0;padding:7px 10px 8px;border-radius:12px;border:1px solid rgba(var(--c-rgb),.28);background:rgba(var(--c-rgb),.05);text-align:right}
  .rs-card small{display:block;text-align:left;font-size:11.5px;color:var(--dim)}
  .rs-card b{display:block;font:700 19px/1.2 var(--display);overflow-wrap:anywhere}
  .rs-d{display:block;min-height:15px;font-size:11.5px;color:var(--dim)}
  .rs-d.up{color:var(--lime)}.rs-d.dn{color:var(--rose)}
  .icon-btn.rot svg{width:22px;height:22px}
  .rs-empty{margin:6px 4px;font-size:13px;color:var(--dim)}
  .sumnote{flex:none;margin:0 2px 10px;font-size:12.5px;color:var(--dim)}

  .table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--edge-strong);border-radius:16px;background:var(--surface);-webkit-overflow-scrolling:touch;box-shadow:0 0 24px rgba(var(--c-rgb),.08);scrollbar-width:thin;scrollbar-color:rgba(var(--c-rgb),.35) transparent}
  .table-wrap.hidden{display:none}
  table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:14.5px}
  th,td{padding:10px 12px;text-align:left;white-space:nowrap;vertical-align:middle;border-bottom:1px solid rgba(var(--e-rgb),.12)}
  th{position:sticky;top:0;z-index:2;background:var(--surface-3);color:var(--cyan);font:600 13.5px var(--display);text-shadow:0 0 8px rgba(var(--c-rgb),.5);border-bottom:1px solid var(--edge-strong)}
  td{background:var(--surface)}
  tbody tr:nth-child(even) td{background:var(--surface-2)}
  tbody tr:hover td{background:var(--surface-hover)}
  /* KIKC ganda: kuning = KIKC sama (posisi beda), merah = KIKC dan posisi sama (kemungkinan input dobel) */
  tbody tr.dup td{background:var(--dup-bg)}
  tbody tr.dup:hover td{background:var(--dup-bg-h)}
  tbody tr.dup td.c-act{box-shadow:inset 4px 0 0 var(--amber)}
  tbody tr.dup td.c-kikc{color:var(--amber)}
  tbody tr.dup2 td{background:var(--dup2-bg)}
  tbody tr.dup2:hover td{background:var(--dup2-bg-h)}
  tbody tr.dup2 td.c-act{box-shadow:inset 4px 0 0 var(--rose)}
  tbody tr.dup2 td.c-kikc{color:var(--rose)}
  .dupbadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font:700 12px var(--body);color:var(--badge-ink);background:var(--amber)}
  tr.dup2 .dupbadge{color:#fff;background:var(--rose)}
  th.sticky,td.sticky{position:sticky;z-index:3}
  th.sticky{z-index:4}
  .c-act{left:0;width:94px;min-width:94px;padding:8px}
  .c-kikc{left:94px;min-width:104px;font:600 15px var(--display);color:var(--cyan);box-shadow:8px 0 14px -8px rgba(var(--c-rgb),.45)}
  td.wrap{white-space:normal;min-width:190px;max-width:260px}
  .row-actions{display:flex;gap:6px}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--edge-strong);color:var(--soft)}
  .tag.pos{color:var(--cyan);border-color:rgba(var(--c-rgb),.6)}
  .tag.good{color:var(--lime);border-color:rgba(var(--g-rgb),.65)}
  .tag.warn{color:var(--amber);border-color:rgba(var(--a-rgb),.65)}
  .tag.bad{color:var(--rose);border-color:rgba(var(--r-rgb),.65)}
  .dim{color:var(--dim)}
  #tableState{flex:1}
  .state{padding:36px 12px;text-align:center;color:var(--dim);font-size:15px}
  .skeleton{height:48px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,rgba(var(--w-rgb),.04),rgba(var(--c-rgb),.09),rgba(var(--w-rgb),.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* ---------- Tab daftar (WOD, GRM, Plan, Celup) ---------- */
  .lcount{flex:none;margin:0 2px 8px;font-size:12.5px;color:var(--dim)}
  .lhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px}
  .lhead .lcount{margin:0}
  .lbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .lhead .btn-sm.arm{border-color:var(--rose);color:var(--rose);background:rgba(var(--r-rgb),.12)}
  .lhead .btn-sm{display:inline-flex;align-items:center;gap:6px;margin:0;min-height:36px;padding:0 14px;font-size:14px}
  .lhead .btn-sm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lstate{flex:1}
  .pager{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
  .pager[hidden]{display:none}
  .pg-btn{flex:none;width:46px;height:46px;display:grid;place-items:center;padding:0;border-radius:14px;cursor:pointer;color:var(--cyan);
    background:rgba(var(--w-rgb),.05);border:1px solid rgba(var(--e-rgb),.3);transition:background .15s,border-color .15s,transform .1s}
  .pg-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pg-btn:active:not(:disabled){transform:scale(.94);background:rgba(var(--c-rgb),.16);border-color:var(--cyan)}
  .pg-btn:disabled{opacity:.3;cursor:default}
  .pg-info{flex:1;min-width:0;text-align:center;font:600 15px var(--display);color:var(--text);line-height:1.25}
  .pg-info b{color:var(--cyan)}
  .pg-info small{display:block;margin-top:1px;font:500 12px var(--body);color:var(--dim)}
  th.l-s,td.l-s{position:sticky;z-index:3}
  th.l-s{z-index:4}
  td.l-s{font:600 15px var(--display);color:var(--cyan)}
  th.l-s0,td.l-s0{left:0}
  td.date{white-space:nowrap;color:var(--dim)}
  th.l-last,td.l-last{box-shadow:8px 0 14px -8px rgba(var(--c-rgb),.45)}
  td.num{font-variant-numeric:tabular-nums}

  /* ---------- Alokasi mesin ---------- */
  .cards-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:rgba(var(--c-rgb),.35) transparent}
  .cards-wrap.hidden{display:none}
  /* Panel per mesin (header: kode, jumlah order aktif, kapasitas, total cone/kg, tombol View/Hide) + kartu lot */
  .mpanel{margin:0 0 14px;padding:10px;border-radius:18px;border:1px solid var(--edge-strong);background:linear-gradient(180deg,rgba(var(--e-rgb),.06),rgba(var(--e-rgb),.015)),var(--surface-3)}
  .mpanel:first-child{margin-top:2px}
  .mhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 10px;border-radius:13px;border:1px solid rgba(var(--g-rgb),.3);background:rgba(var(--g-rgb),.08)}
  .mid{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
  .mbadge{flex:none;padding:5px 11px;border-radius:9px;font:700 15px var(--display);color:var(--ink-g);background:var(--lime)}
  .mname{font:700 16px var(--display);color:var(--text)}
  .mpill{padding:3px 10px;border-radius:999px;font:600 12px var(--body);color:var(--lime);background:rgba(var(--g-rgb),.14);border:1px solid rgba(var(--g-rgb),.32);white-space:nowrap}
  .mcap{font:500 12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);white-space:nowrap}
  .mcap.over{color:var(--rose);font-weight:700}
  .mtot{display:flex;align-items:center;gap:8px;margin-left:auto;font:500 12.5px var(--body);color:var(--dim)}
  .mtot b{padding:4px 10px;border-radius:9px;font:700 15px var(--display);color:var(--lime);background:rgba(var(--g-rgb),.16);white-space:nowrap}
  .mview{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--edge-strong);background:rgba(var(--w-rgb),.05);color:var(--text);font:600 13px var(--body);cursor:pointer}
  .mview svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mview:hover,.mview:focus-visible{border-color:var(--cyan);outline:none}
  .mview[aria-expanded="true"]{color:var(--cyan);border-color:var(--cyan)}
  .mpanel.stop .mhead{border-color:rgba(var(--r-rgb),.4);background:rgba(var(--r-rgb),.08)}
  .mpanel.stop .mbadge{background:var(--rose);color:#fff}
  .mpanel.stop .mpill{color:var(--rose);background:rgba(var(--r-rgb),.12);border-color:rgba(var(--r-rgb),.4)}
  .mpanel.stop .mtot b{color:var(--rose);background:rgba(var(--r-rgb),.14)}
  /* Tombol geser Ready / Stop per mesin */
  .mswitch{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px 0 4px;border-radius:999px;border:1px solid rgba(var(--g-rgb),.5);background:rgba(var(--g-rgb),.12);color:var(--lime);font:700 12px var(--body);cursor:pointer}
  .mswitch i{position:relative;display:block;width:26px;height:16px;border-radius:999px;background:var(--lime);transition:background .15s}
  .mswitch i::after{content:"";position:absolute;top:2px;left:12px;width:12px;height:12px;border-radius:50%;background:var(--ink-g);transition:left .15s}
  .mswitch[aria-checked="false"]{border-color:rgba(var(--r-rgb),.55);background:rgba(var(--r-rgb),.12);color:var(--rose)}
  .mswitch[aria-checked="false"] i{background:var(--rose)}
  .mswitch[aria-checked="false"] i::after{left:2px;background:#fff}
  .mswitch:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .mswitch:disabled{opacity:.5;cursor:wait}
  .mnone{margin:10px 2px 2px;font-size:13px;color:var(--dim)}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
  .mpanel.detail .mgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .mcard{position:relative;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--edge-strong);background:var(--surface);text-align:left;color:var(--text)}
  .mcard.moved{border-color:rgba(var(--a-rgb),.85)}
  .mcard.sisa{border-color:rgba(var(--r-rgb),.85);background:linear-gradient(180deg,rgba(var(--r-rgb),.14),rgba(var(--r-rgb),.04)),var(--surface);box-shadow:inset 3px 0 0 var(--rose),0 0 12px rgba(var(--r-rgb),.28)}
  .mc-flag.sisa{color:var(--rose)}
  .mcard.fin{border-color:rgba(var(--g-rgb),.8);background:linear-gradient(180deg,rgba(var(--g-rgb),.10),rgba(var(--g-rgb),.03)),var(--surface)}
  .mc-det{display:none}
  .mpanel.detail .mc-cmp{display:none}
  .mpanel.detail .mc-det{display:block}
  .mc-k{font:700 14px var(--display);letter-spacing:.2px;color:var(--lime);overflow-wrap:anywhere}
  .mc-y{margin-top:3px;font:500 12px var(--body);color:var(--soft);overflow-wrap:anywhere}
  .mc-y em{font-style:normal;font-weight:700;color:var(--amber)}
  .mc-n{display:flex;justify-content:space-between;gap:6px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(var(--e-rgb),.22);font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--soft)}
  .mc-n b{color:var(--lime)}
  .mc-flag{margin-top:5px;font:600 11.5px var(--body);color:var(--amber);overflow-wrap:anywhere}
  .mc-flag.ok{color:var(--lime)}
  .mc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .mc-cy{flex:none;padding:2px 7px;border-radius:6px;font:700 10px var(--body);letter-spacing:.5px;color:var(--dim);background:rgba(var(--w-rgb),.06);border:1px solid var(--edge)}
  .mc-wb{min-width:0;padding:2px 7px;border-radius:6px;font:700 11px var(--display);color:var(--amber);border:1px solid rgba(var(--a-rgb),.45);background:rgba(var(--a-rgb),.1);text-align:right;overflow-wrap:anywhere}
  .mc-l{display:block;margin-top:9px;font:600 10px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
  .mc-v{display:block;font:700 15px var(--display);color:var(--lime);overflow-wrap:anywhere}
  .mc-yt{display:block;font:600 12.5px var(--body);color:var(--text);overflow-wrap:anywhere}
  .mc-yt b{color:var(--lime)}
  .mc-nums{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  .mc-nums div{padding:5px 8px;border-radius:8px;border:1px solid var(--edge);background:rgba(var(--w-rgb),.04)}
  .mc-nums small{display:block;font:600 9.5px var(--body);letter-spacing:.5px;color:var(--dim)}
  .mc-nums b{font:700 14px var(--display);color:var(--text)}
  .mc-nums div:last-child b{color:var(--lime)}
  /* Kolom ALOKASI di tab Plan: pilihan mesin yang bisa diubah langsung */
  select.alok{min-width:78px;min-height:34px;padding:0 8px;border-radius:9px;border:1px solid var(--edge-strong);background:rgba(var(--w-rgb),.05);color:var(--dim);font:600 14px var(--display);color-scheme:var(--scheme);cursor:pointer}
  select.alok.has{color:var(--cyan);border-color:rgba(var(--c-rgb),.6)}
  select.alok:focus-visible{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  select.alok.sv{border-color:var(--amber);opacity:.7}
  select.alok option{color:#000}
  .mc-kt{display:block;font:500 12px var(--body);color:var(--soft);overflow-wrap:anywhere}
  .mnote{flex:none;margin:0 2px 8px;font-size:12.5px;color:var(--dim)}

  /* ---------- Tab bawah ---------- */
  .tabbar{flex:none;display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--edge);background:var(--bar);padding-bottom:var(--safe-bottom)}
  .tab{position:relative;min-width:0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--dim);font:600 13px var(--body);cursor:pointer}
  .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--cyan);text-shadow:0 0 10px rgba(var(--c-rgb),.7)}
  .tab.active svg{filter:drop-shadow(0 0 5px rgba(var(--c-rgb),.9))}
  .tab.active::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan),0 0 30px rgba(var(--c-rgb),.6)}

  /* ---------- Toast & lembar (sheet) ---------- */
  .toast{position:absolute;left:14px;right:14px;bottom:calc(78px + var(--safe-bottom));z-index:90;padding:13px 16px;border-radius:16px;background:var(--bar-solid);border:1px solid var(--edge-strong);font-size:15px;font-weight:600;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;overflow-wrap:anywhere}
  .toast.show{opacity:1;transform:none}
  .toast.ok{border-color:var(--lime);box-shadow:0 0 22px rgba(var(--g-rgb),.35)}
  .toast.err{border-color:var(--rose);box-shadow:0 0 22px rgba(var(--r-rgb),.35)}
  .toast.warn{border-color:var(--amber);box-shadow:0 0 22px rgba(var(--a-rgb),.3)}
  .sheet-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;z-index:70;display:none;align-items:flex-end;background:rgba(2,4,12,.74)}
  .sheet-backdrop.show{display:flex}
  .sheet{width:100%;padding:22px 18px calc(18px + var(--safe-bottom));border-radius:24px 24px 0 0;border:1px solid var(--edge-strong);border-bottom:0;background:var(--surface);box-shadow:0 -10px 50px rgba(var(--r-rgb),.18)}
  .sheet h2{margin:0 0 8px;font:700 21px var(--display)}
  .sheet p{margin:0 0 18px;color:var(--dim);font-size:15.5px;overflow-wrap:anywhere}
  .sheet .actions{margin-top:0}
  .sheet .actions .btn-ghost{width:40%}
  .sheet .spinner{border-color:rgba(255,255,255,.3);border-top-color:#fff}
  .sheet.tall{display:flex;flex-direction:column;max-height:94%;padding:0;box-shadow:0 -10px 50px rgba(var(--c-rgb),.18)}
  .sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--edge)}

<script>
/* Tinggi bingkai aplikasi = tinggi layar yang benar-benar terlihat (terkecil dari innerHeight / clientHeight / visualViewport), bukan 100vh yang bisa lebih tinggi dari layar di sebagian peramban HP */
(function () {
  var d = document.documentElement, vv = window.visualViewport;
  function fit() {
    var a = [window.innerHeight, d.clientHeight];
    if (vv && vv.scale <= 1.01) a.push(vv.height);
    a = a.filter(function (x) { return x > 200; });
    if (a.length) d.style.setProperty('--app-h', Math.floor(Math.min.apply(null, a)) + 'px');
  }
  fit();
  ['resize', 'orientationchange', 'pageshow', 'focus'].forEach(function (e) { window.addEventListener(e, function () { fit(); setTimeout(fit, 250); }); });
  if (vv) vv.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', fit);
  [300, 900, 2000].forEach(function (t) { setTimeout(fit, t); });
})();

  /* ---------- Koneksi ke server (sama dengan halaman 1) ---------- */
  function lsGet(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* abaikan */ } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
  var API_URL = String(window.WIPYD_API_URL || '').trim() || lsGet('wipyd_api') || '';
  var IN_GAS = !!(window.google && google.script && google.script.run);
  var API_TIMEOUT = 60000;
  function apiReady() { return /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL); }
  function askApiUrl(cur) {
    var u = window.prompt('Tempel URL web app Apps Script (berakhiran /exec). Cukup sekali di HP ini.', cur || '');
    if (u === null) return false;
    u = String(u).trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u)) { window.alert('URL tidak valid. Harus diawali https://script.google.com/ dan berakhiran /exec'); return false; }
    API_URL = u; lsSet('wipyd_api', u);
    return true;
  }
  function callApi(fn, args, retried) {
    if (!apiReady() && !askApiUrl()) return Promise.reject(new Error('URL web app belum diisi. Buka halaman 1, ketuk dua kali logo, lalu tempel URL web app (berakhiran /exec).'));
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, API_TIMEOUT);
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args, pin: lsGet('wipyd_pin') }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) { return res.text(); }).then(function (t) {
      clearTimeout(timer);
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('Server tidak membalas dengan benar. Pastikan deploy web app: Who has access = Anyone, lalu deploy ulang (versi baru).'); }
      if (j && j.ok) return j.result;
      if (j && j.code === 'PIN') {
        lsDel('wipyd_pin');
        if (retried) throw new Error('PIN salah.');
        var p = window.prompt('Masukkan PIN aplikasi');
        if (p === null || !String(p).trim()) throw new Error('PIN dibatalkan.');
        lsSet('wipyd_pin', String(p).trim());
        return callApi(fn, args, true);
      }
      throw new Error((j && j.error) || 'Server mengembalikan galat.');
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') throw new Error('Server terlalu lama menjawab. Coba lagi.');
      if (e instanceof TypeError) throw new Error('Tidak bisa menghubungi server. Cek internet dan URL web app.');
      throw e;
    });
  }
  function gs(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!IN_GAS) return callApi(fn, args, false);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }
  var toastTimer = null;
  function toast(msg, type, ms) {
    var t = $('#toast');
    t.className = 'toast ' + (type || 'ok'); t.textContent = msg;
    void t.offsetWidth; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 4000);
  }

  /* ---------- Tema (default malam) ---------- */
  var btnTheme = $('#btnTheme');
  function curTheme() { return ROOT.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function applyTheme(t, save) {
    ROOT.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#eef2fb' : '#050814');
    var label = t === 'light' ? 'Ganti ke mode gelap' : 'Ganti ke mode terang';
    btnTheme.setAttribute('aria-label', label); btnTheme.title = label;
    if (save) lsSet('wipyd_theme', t);
  }
  btnTheme.addEventListener('click', function () { applyTheme(curTheme() === 'light' ? 'dark' : 'light', true); });
  applyTheme(curTheme(), false);

  /* ---------- Pindah halaman ---------- */
  function goHome() {
    if (IN_GAS) {
      gs('getPageUrl', 1, MODE).then(function (u) { if (u) window.open(u, '_top'); else toast('Alamat halaman 1 tidak ditemukan.', 'warn', 5000); })
        .catch(function (e) { toast('Halaman 1 gagal dibuka. ' + errMsg(e), 'err', 6000); });
      return;
    }
    location.href = 'index.html' + (MODE === 'viewer' ? '?mode=viewer' : '');
  }
  $('#btnHome').addEventListener('click', goHome);
  $('#tabHome').addEventListener('click', goHome);

  /* ---------- Daftar Pack dan RPH (isi sheet apa adanya, urut tanggal terbaru bila ada kolom tanggal) ---------- */
  var LISTS = { pack: { id: 'Pack', label: 'Pack' }, rph: { id: 'Rph', label: 'RPH' } };
  var LIST_FRESH = 60000;
  var lst = {}, view = 'pack';
  Object.keys(LISTS).forEach(function (k) { lst[k] = { headers: [], rows: [], sig: '', at: 0, loading: false, query: '', error: '', page: 1, rk: '' }; });
  var mqWide = window.matchMedia ? window.matchMedia('(min-width:900px)') : null;
  function pageSize() { return mqWide && mqWide.matches ? 100 : 50; }
  function hashStr(t) { var h = 5381; for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return t.length + ':' + h; }
  function listState(k, html) { var el = $('#s' + LISTS[k].id); el.style.display = html ? '' : 'none'; el.innerHTML = html || ''; }

  function renderList(k) {
    var d = LISTS[k], m = lst[k], q = nq(m.query.trim());
    var wrap = $('#w' + d.id), pager = $('#p' + d.id), note = $('#n' + d.id);
    if (!m.headers.length || !m.rows.length) {
      m.rk = ''; wrap.classList.add('hidden'); pager.hidden = true; note.textContent = '';
      if (m.loading) listState(k, '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>');
      else if (m.error) listState(k, '<div class="state">' + esc(m.error) + '<br><button type="button" class="btn-sm" data-retry="1">Coba lagi</button></div>');
      else if (m.at) listState(k, '<div class="state">Sheet ' + esc(d.label) + ' belum berisi data.</div>');
      else listState(k, '');
      return;
    }
    var ps = pageSize(), rk = m.sig + '|' + q + '|' + m.page + '|' + ps;
    if (rk === m.rk) return;
    var rows = m.rows.filter(function (r) { return !q || nq(r.join(' ')).indexOf(q) >= 0; });
    if (!rows.length) {
      m.rk = ''; wrap.classList.add('hidden'); pager.hidden = true;
      note.textContent = '0 dari ' + m.rows.length + ' baris';
      listState(k, '<div class="state">Tidak ada baris yang cocok dengan pencarian.</div>');
      return;
    }
    listState(k, '');
    var pages = Math.max(1, Math.ceil(rows.length / ps));
    if (m.page > pages) m.page = pages;
    if (m.page < 1) m.page = 1;
    var start = (m.page - 1) * ps, shown = rows.slice(start, start + ps), hd = m.headers;
    var cc = hd.map(function (h) {
      var c = [];
      if (/tanggal|tgl|date/i.test(h)) c.push('date');
      if (/ket|note|catatan|remark/i.test(h)) c.push('wrap');
      if (/^(kg|cone|qty|jumlah|berat)\b/i.test(h)) c.push('num');
      return c;
    });
    $('#h' + d.id).innerHTML = hd.map(function (h, i) { return '<th' + (i === 0 ? ' class="l-s l-s0 l-last"' : '') + '>' + esc(h) + '</th>'; }).join('');
    $('#b' + d.id).innerHTML = shown.map(function (r) {
      return '<tr>' + hd.map(function (h, i) {
        var c = cc[i].slice(); if (i === 0) c.push('l-s', 'l-s0', 'l-last');
        var v = r[i] === undefined || r[i] === null ? '' : r[i];
        return '<td' + (c.length ? ' class="' + c.join(' ') + '"' : '') + '>' + (v === '' ? '<span class="dim">-</span>' : esc(v)) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    wrap.classList.remove('hidden');
    var sp = q + '|' + m.page;
    if (sp !== m.sp) { wrap.scrollTop = 0; m.sp = sp; }
    note.textContent = (q ? rows.length + ' dari ' + m.rows.length : m.rows.length) + ' baris';
    pager.hidden = pages <= 1;
    $('#pi' + d.id).innerHTML = 'Halaman <b>' + m.page + '</b> dari ' + pages + '<small>baris ' + (start + 1) + '–' + (start + shown.length) + ' dari ' + rows.length + '</small>';
    $$('#p' + d.id + ' [data-pg]').forEach(function (b) {
      var g = b.getAttribute('data-pg');
      b.disabled = (g === 'first' || g === 'prev') ? m.page <= 1 : m.page >= pages;
    });
    m.rk = rk;
  }
  function stopSpin() { if (!Object.keys(lst).some(function (k) { return lst[k].loading; })) $('#btnRefresh').classList.remove('spin'); }
  function loadList(k, force) {
    var m = lst[k];
    if (m.loading) return Promise.resolve();
    if (!force && m.at && Date.now() - m.at < LIST_FRESH) return Promise.resolve();
    m.loading = true; m.error = '';
    if (view === k) $('#btnRefresh').classList.add('spin');
    renderList(k);
    return gs('getSheetList', k, !!force).then(function (r) {
      if (!r) throw new Error('Server tidak mengembalikan data.');
      if (r.error) throw new Error(r.error);
      var sig = hashStr(JSON.stringify(r.rows || []) + JSON.stringify(r.headers || []));
      m.at = Date.now(); m.error = '';
      if (sig !== m.sig || !m.rows.length) { m.headers = r.headers || []; m.rows = r.rows || []; m.sig = sig; }
    }).catch(function (e) {
      m.error = 'Gagal memuat data. ' + errMsg(e);
      if (m.rows.length) toast('Gagal memperbarui, menampilkan data sebelumnya. ' + errMsg(e), 'err', 6000);
    }).then(function () { m.loading = false; stopSpin(); renderList(k); });
  }
  Object.keys(LISTS).forEach(function (k) {
    var d = LISTS[k], t = null;
    $('#q' + d.id).addEventListener('input', function () {
      var v = this.value; clearTimeout(t);
      t = setTimeout(function () { lst[k].query = v; lst[k].page = 1; renderList(k); }, 150);
    });
    $('#p' + d.id).addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-pg]') : null;
      if (!b || b.disabled) return;
      var g = b.getAttribute('data-pg'), m = lst[k];
      if (g === 'first') m.page = 1; else if (g === 'prev') m.page -= 1; else if (g === 'next') m.page += 1; else m.page = 1e9;
      renderList(k);
    });
    $('#s' + d.id).addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-retry]')) loadList(k, true); });
  });
  if (mqWide) {
    var onWide = function () { Object.keys(lst).forEach(function (k) { lst[k].rk = ''; lst[k].page = 1; }); renderList(view); };
    if (mqWide.addEventListener) mqWide.addEventListener('change', onWide); else if (mqWide.addListener) mqWide.addListener(onWide);
  }

  function showView(name) {
    view = name;
    Object.keys(LISTS).forEach(function (k) { $('#view' + LISTS[k].id).classList.toggle('active', name === k); });
    $$('.tab').forEach(function (b) {
      var on = b.getAttribute('data-view') === name;
      b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    $('#subtitle').textContent = 'Halaman 2 · ' + LISTS[name].label + ' · terbaru di atas';
    renderList(name);
    loadList(name, false);
  }
  $('#tabPack').addEventListener('click', function () { showView('pack'); });
  $('#tabRph').addEventListener('click', function () { showView('rph'); });
  $('#btnRefresh').addEventListener('click', function () { loadList(view, true); });
  $('.brand').addEventListener('dblclick', function () {
    if (IN_GAS) return;
    if (String(window.WIPYD_API_URL || '').trim()) { window.prompt('URL server diatur di config.js. URL sekarang:', API_URL); return; }
    if (askApiUrl(API_URL)) { toast('URL server disimpan. Memuat ulang data...', 'ok'); loadList(view, true); }
  });
  window.addEventListener('offline', function () { toast('Tidak ada koneksi internet.', 'err', 6000); });
  if (!IN_GAS && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  showView('pack');
  setTimeout(function () { loadList('rph', false); }, 1200);   // RPH disiapkan di latar belakang
})();
</script>
<script>
/* Menu tab: tab aktif otomatis berada di area terlihat saat menu bisa digeser mendatar */
(function () {
  var bar = document.querySelector('.tabbar');
  if (!bar) return;
  function center() {
    var t = bar.querySelector('.tab.active');
    if (!t || bar.scrollWidth <= bar.clientWidth + 1) return;
    bar.scrollTo ? bar.scrollTo({ left: t.offsetLeft - (bar.clientWidth - t.offsetWidth) / 2, behavior: 'smooth' }) : (bar.scrollLeft = t.offsetLeft - (bar.clientWidth - t.offsetWidth) / 2);
  }
  new MutationObserver(center).observe(bar, { attributes: true, attributeFilter: ['class'], subtree: true });
  window.addEventListener('resize', center);
  setTimeout(center, 400);
})();
</script>
</body>
